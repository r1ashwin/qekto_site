<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Application board | Qekto</title>
    <meta
      name="description"
      content="Private countdown board for YC W27 and a16z speedrun SR008 application deadlines."
    />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #2b3038;
        --panel: #23282f;
        --ink: #ffffff;
        --mute: #9aa3ad;
        --mute-soft: #6f7884;
        --yc: #ff6600;
        --hair: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }

      .board {
        height: 100vh;
        width: 100%;
        padding: clamp(12px, 1.6vw, 24px);
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: clamp(10px, 1.2vw, 16px);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .brand-kicker {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--mute-soft);
        font-weight: 600;
      }

      .now-clocks {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        min-width: min(420px, 100%);
      }

      .clock-card {
        background: rgba(0, 0, 0, 0.18);
        border: 1px solid var(--hair);
        border-radius: 10px;
        padding: 8px 12px;
      }

      .clock-card .label {
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--mute-soft);
        font-weight: 600;
      }

      .clock-card .time {
        margin-top: 2px;
        font-size: clamp(16px, 1.6vw, 22px);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }

      .clock-card .date {
        margin-top: 1px;
        color: var(--mute);
        font-size: 12px;
      }

      .tracks {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(10px, 1.4vw, 18px);
        min-height: 0;
      }

      .track {
        background: var(--panel);
        border: 1px solid var(--hair);
        border-radius: 18px;
        padding: clamp(16px, 2vw, 28px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 0;
        gap: clamp(10px, 1.2vw, 18px);
      }

      .logo {
        width: clamp(52px, 4.8vw, 68px);
        height: clamp(52px, 4.8vw, 68px);
        border-radius: 10px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }

      .logo.yc {
        background: var(--yc);
        color: #fff;
        font-size: clamp(32px, 3vw, 42px);
        font-weight: 700;
        line-height: 1;
      }

      .logo.a16z {
        background: #f4f1ea;
        color: #111;
        font-size: clamp(13px, 1.2vw, 15px);
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .program {
        font-size: clamp(15px, 1.4vw, 18px);
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .deadline-lines {
        color: var(--mute);
        font-size: clamp(13px, 1.2vw, 16px);
        line-height: 1.4;
      }

      .deadline-lines strong {
        color: var(--ink);
        font-weight: 600;
      }

      .decimal-timer {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        line-height: 0.88;
        margin: clamp(4px, 0.8vw, 10px) 0;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1;
      }

      .days-int {
        font-size: clamp(110px, 16vw, 210px);
        font-weight: 700;
        letter-spacing: -0.055em;
        color: #fff;
      }

      .days-frac-wrap {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-top: 0.14em;
      }

      .days-frac {
        font-size: clamp(48px, 7vw, 96px);
        font-weight: 600;
        letter-spacing: -0.04em;
        color: #fff;
      }

      .days-label {
        margin-top: 0.2em;
        font-size: clamp(20px, 2.4vw, 34px);
        font-weight: 500;
        color: var(--mute);
      }

      .footer {
        color: var(--mute-soft);
        font-size: 11px;
        letter-spacing: 0.04em;
        text-align: center;
      }

      @media (max-width: 980px) {
        body {
          overflow: auto;
        }

        .board {
          height: auto;
          min-height: 100vh;
        }

        .tracks {
          grid-template-columns: 1fr;
        }

        .days-int {
          font-size: clamp(96px, 28vw, 160px);
        }

        .days-frac {
          font-size: clamp(42px, 12vw, 72px);
        }
      }

      @media (max-width: 640px) {
        .now-clocks {
          grid-template-columns: 1fr;
          min-width: 0;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="board">
      <header class="topbar">
        <div class="brand-kicker">Qekto · private board</div>
        <div class="now-clocks" aria-live="polite">
          <div class="clock-card">
            <div class="label">India · IST</div>
            <div class="time" id="ist-time">--:--:--</div>
            <div class="date" id="ist-date">—</div>
          </div>
          <div class="clock-card">
            <div class="label">Pacific · PT</div>
            <div class="time" id="pt-time">--:--:--</div>
            <div class="date" id="pt-date">—</div>
          </div>
        </div>
      </header>

      <section class="tracks" aria-label="Program countdowns">
        <article class="track" data-track="yc">
          <div class="logo yc" aria-hidden="true">Y</div>
          <div class="program">YC Winter 2027</div>

          <div class="decimal-timer" aria-label="YC days remaining">
            <span class="days-int" data-int>0</span>
            <span class="days-frac-wrap">
              <span class="days-frac" data-frac>.0000000</span>
              <span class="days-label">days</span>
            </span>
          </div>

          <div class="deadline-lines">
            <div><strong>Nov 2, 2026 · 8:00 PM PT</strong></div>
            <div>Nov 3, 2026 · 9:30 AM IST</div>
          </div>
        </article>

        <article class="track" data-track="sr">
          <div class="logo a16z" aria-hidden="true">a16z</div>
          <div class="program">speedrun SR008</div>

          <div class="decimal-timer" aria-label="speedrun days remaining">
            <span class="days-int" data-int>0</span>
            <span class="days-frac-wrap">
              <span class="days-frac" data-frac>.0000000</span>
              <span class="days-label">days</span>
            </span>
          </div>

          <div class="deadline-lines">
            <div><strong>Nov 1, 2026 · 11:59 PM PT</strong></div>
            <div>Nov 2, 2026 · 1:29 PM IST</div>
          </div>
        </article>
      </section>

      <footer class="footer">Personal countdown · noindex</footer>
    </main>

    <script>
      // YC: Nov 2, 2026 8:00 PM PT = 2026-11-03T04:00:00Z
      // SR008: Nov 1, 2026 11:59 PM PT = 2026-11-02T07:59:00Z
      const TRACKS = {
        yc: Date.parse("2026-11-03T04:00:00.000Z"),
        sr: Date.parse("2026-11-02T07:59:00.000Z"),
      };
      const MS_PER_DAY = 86400000;

      function formatZone(date, timeZone) {
        const time = new Intl.DateTimeFormat("en-IN", {
          timeZone,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).format(date);
        const day = new Intl.DateTimeFormat("en-IN", {
          timeZone,
          weekday: "short",
          day: "numeric",
          month: "short",
          year: "numeric",
        }).format(date);
        return { time, day };
      }

      function renderDays(card, remainingMs) {
        const intEl = card.querySelector("[data-int]");
        const fracEl = card.querySelector("[data-frac]");
        if (remainingMs <= 0) {
          intEl.textContent = "0";
          fracEl.textContent = ".0000000";
          return;
        }
        const days = remainingMs / MS_PER_DAY;
        const whole = Math.floor(days);
        const frac = days - whole;
        intEl.textContent = String(whole);
        fracEl.textContent = "." + frac.toFixed(7).slice(2);
      }

      function tick() {
        const now = new Date();
        const ist = formatZone(now, "Asia/Kolkata");
        const pt = formatZone(now, "America/Los_Angeles");
        document.getElementById("ist-time").textContent = ist.time;
        document.getElementById("ist-date").textContent = ist.day;
        document.getElementById("pt-time").textContent = pt.time;
        document.getElementById("pt-date").textContent = pt.day;

        for (const [key, deadline] of Object.entries(TRACKS)) {
          const card = document.querySelector(`[data-track="${key}"]`);
          if (!card) continue;
          renderDays(card, deadline - now.getTime());
        }
      }

      tick();
      setInterval(tick, 40);
    </script>
  </body>
</html>
